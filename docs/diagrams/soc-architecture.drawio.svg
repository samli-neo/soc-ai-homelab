<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">AI SOC Automation Homelab Architecture</title>
  <desc id="desc">Large-format SOC architecture diagram using public logos for Wazuh, pfSense, Snort, Microsoft Defender, Shuffle, MISP, Cortex, TheHive, CAPEv2, Ghidra, CAPA, YARA, Velociraptor, Docker, and GitHub Actions.</desc>

  <defs>
    <radialGradient id="bgA" cx="12%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#123b59" stop-opacity="0.9"/>
      <stop offset="58%" stop-color="#061017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgB" cx="88%" cy="12%" r="58%">
      <stop offset="0%" stop-color="#30245f" stop-opacity="0.75"/>
      <stop offset="58%" stop-color="#061017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#061017"/>
      <stop offset="52%" stop-color="#0a1723"/>
      <stop offset="100%" stop-color="#050b12"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#173044" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0b1823" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#102333"/>
      <stop offset="100%" stop-color="#08141f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#43d9ff" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#43d9ff"/>
      <stop offset="100%" stop-color="#27f5b1" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L16,9 L2,16 Z" fill="#43d9ff"/>
    </marker>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="2400" height="1500" fill="url(#bg)"/>
  <rect width="2400" height="1500" fill="url(#bgA)"/>
  <rect width="2400" height="1500" fill="url(#bgB)"/>
  <rect width="2400" height="1500" fill="url(#grid)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="110" y="110" fill="#43d9ff" font-size="25" font-weight="800" letter-spacing="5">AI SOC AUTOMATION HOMELAB</text>
    <text x="110" y="176" fill="#eef8ff" font-size="70" font-weight="900" letter-spacing="-3">Clear End-to-End SOC Architecture</text>
    <text x="110" y="225" fill="#a9becf" font-size="29">Detection, SOAR, enrichment, malware analysis, DFIR, cases, approval gates, and audit-safe response.</text>

    <g transform="translate(1850 78)" filter="url(#shadow)">
      <rect width="420" height="170" rx="30" fill="#061017" fill-opacity="0.76" stroke="#43d9ff" stroke-opacity="0.35"/>
      <text x="30" y="50" fill="#eef8ff" font-size="24" font-weight="850">Portfolio-safe mode</text>
      <text x="30" y="88" fill="#a9becf" font-size="18">Private repo until final review</text>
      <text x="30" y="119" fill="#a9becf" font-size="18">No secrets, samples, or evidence</text>
      <text x="30" y="150" fill="#a9becf" font-size="18">Human approval for high-risk actions</text>
    </g>

    <g transform="translate(90 315)" filter="url(#shadow)">
      <rect width="510" height="900" rx="34" fill="url(#panel)" stroke="#43d9ff" stroke-opacity="0.18"/>
      <text x="38" y="58" fill="#eef8ff" font-size="31" font-weight="900">1. Telemetry &amp; Detection</text>
      <text x="38" y="98" fill="#8fa8ba" font-size="19">Endpoint, firewall, IDS, and Windows telemetry</text>

      <g transform="translate(38 140)">
        <rect width="434" height="120" rx="24" fill="url(#card)" stroke="#43d9ff" stroke-opacity="0.24"/>
        <rect x="22" y="22" width="76" height="76" rx="20" fill="#f8fbff"/>
        <image x="34" y="34" width="52" height="52" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/wazuh.svg"/>
        <text x="122" y="49" fill="#eef8ff" font-size="25" font-weight="900">Wazuh</text>
        <text x="122" y="82" fill="#8fa8ba" font-size="18">SIEM/XDR, rules, FIM, SCA</text>
      </g>

      <g transform="translate(38 284)">
        <rect width="434" height="105" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="29" width="48" height="48" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/pfsense.svg"/>
        <text x="110" y="44" fill="#eef8ff" font-size="23" font-weight="850">pfSense</text>
        <text x="110" y="74" fill="#8fa8ba" font-size="17">Firewall and network logs</text>
      </g>

      <g transform="translate(38 410)">
        <rect width="434" height="105" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="30" y="30" width="46" height="46" href="https://cdn.simpleicons.org/snort/E61B23"/>
        <text x="110" y="44" fill="#eef8ff" font-size="23" font-weight="850">Snort</text>
        <text x="110" y="74" fill="#8fa8ba" font-size="17">IDS signatures and alerts</text>
      </g>

      <g transform="translate(38 536)">
        <rect width="434" height="105" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="29" width="48" height="48" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/microsoft-defender.svg"/>
        <text x="110" y="44" fill="#eef8ff" font-size="23" font-weight="850">Microsoft Defender</text>
        <text x="110" y="74" fill="#8fa8ba" font-size="17">Windows endpoint events</text>
      </g>

      <g transform="translate(38 700)">
        <rect width="126" height="42" rx="21" fill="#43d9ff" fill-opacity="0.12" stroke="#43d9ff" stroke-opacity="0.28"/>
        <text x="22" y="27" fill="#c9f3ff" font-size="16" font-weight="800">Decoders</text>
        <rect x="144" width="94" height="42" rx="21" fill="#43d9ff" fill-opacity="0.12" stroke="#43d9ff" stroke-opacity="0.28"/>
        <text x="168" y="27" fill="#c9f3ff" font-size="16" font-weight="800">Rules</text>
        <rect x="256" width="158" height="42" rx="21" fill="#43d9ff" fill-opacity="0.12" stroke="#43d9ff" stroke-opacity="0.28"/>
        <text x="281" y="27" fill="#c9f3ff" font-size="16" font-weight="800">IOC matching</text>
      </g>
    </g>

    <g transform="translate(675 315)" filter="url(#shadow)">
      <rect width="520" height="900" rx="34" fill="url(#panel)" stroke="#43d9ff" stroke-opacity="0.18"/>
      <text x="38" y="58" fill="#eef8ff" font-size="31" font-weight="900">2. SOAR &amp; Casework</text>
      <text x="38" y="98" fill="#8fa8ba" font-size="19">Workflow routing, enrichment, cases, and tasks</text>

      <g transform="translate(38 140)">
        <rect width="444" height="120" rx="24" fill="url(#card)" stroke="#43d9ff" stroke-opacity="0.24"/>
        <rect x="22" y="22" width="76" height="76" rx="20" fill="#f8fbff"/>
        <image x="34" y="34" width="52" height="52" href="https://www.google.com/s2/favicons?domain=shuffler.io&amp;sz=128"/>
        <text x="122" y="49" fill="#eef8ff" font-size="25" font-weight="900">Shuffle</text>
        <text x="122" y="82" fill="#8fa8ba" font-size="18">SOAR workflow automation</text>
      </g>

      <g transform="translate(38 288)">
        <rect width="444" height="110" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="22" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="31" width="48" height="48" href="https://www.google.com/s2/favicons?domain=misp-project.org&amp;sz=128"/>
        <text x="110" y="47" fill="#eef8ff" font-size="23" font-weight="850">MISP</text>
        <text x="110" y="78" fill="#8fa8ba" font-size="17">Threat-intel enrichment</text>
      </g>

      <g transform="translate(38 421)">
        <rect width="444" height="110" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="22" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="31" width="48" height="48" href="https://avatars.githubusercontent.com/u/22081224?v=4"/>
        <text x="110" y="47" fill="#eef8ff" font-size="23" font-weight="850">Cortex</text>
        <text x="110" y="78" fill="#8fa8ba" font-size="17">Analyzer runner</text>
      </g>

      <g transform="translate(38 554)">
        <rect width="444" height="110" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="22" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="31" width="48" height="48" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/thehive.svg"/>
        <text x="110" y="47" fill="#eef8ff" font-size="23" font-weight="850">TheHive</text>
        <text x="110" y="78" fill="#8fa8ba" font-size="17">Cases, dedupe, tasks</text>
      </g>

      <g transform="translate(38 712)">
        <rect width="172" height="42" rx="21" fill="#27f5b1" fill-opacity="0.10" stroke="#27f5b1" stroke-opacity="0.28"/>
        <text x="24" y="27" fill="#cdfbed" font-size="16" font-weight="800">Quality gates</text>
        <rect x="190" width="184" height="42" rx="21" fill="#27f5b1" fill-opacity="0.10" stroke="#27f5b1" stroke-opacity="0.28"/>
        <text x="215" y="27" fill="#cdfbed" font-size="16" font-weight="800">Semantic E2E</text>
      </g>
    </g>

    <g transform="translate(1270 315)" filter="url(#shadow)">
      <rect width="520" height="900" rx="34" fill="url(#panel)" stroke="#43d9ff" stroke-opacity="0.18"/>
      <text x="38" y="58" fill="#eef8ff" font-size="31" font-weight="900">3. Malware &amp; DFIR</text>
      <text x="38" y="98" fill="#8fa8ba" font-size="19">Sandboxing, static analysis, and collection</text>

      <g transform="translate(38 140)">
        <rect width="444" height="106" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="29" width="48" height="48" href="https://avatars.githubusercontent.com/u/22219888?v=4"/>
        <text x="110" y="44" fill="#eef8ff" font-size="23" font-weight="850">CAPEv2</text>
        <text x="110" y="74" fill="#8fa8ba" font-size="17">Controlled sandbox analysis</text>
      </g>

      <g transform="translate(38 270)">
        <rect width="444" height="106" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="29" width="48" height="48" href="https://www.google.com/s2/favicons?domain=ghidra-sre.org&amp;sz=128"/>
        <text x="110" y="44" fill="#eef8ff" font-size="23" font-weight="850">Ghidra</text>
        <text x="110" y="74" fill="#8fa8ba" font-size="17">Reverse engineering pipeline</text>
      </g>

      <g transform="translate(38 400)">
        <rect width="444" height="106" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="29" width="48" height="48" href="https://avatars.githubusercontent.com/u/331209?v=4"/>
        <text x="110" y="44" fill="#eef8ff" font-size="23" font-weight="850">CAPA</text>
        <text x="110" y="74" fill="#8fa8ba" font-size="17">Capability extraction</text>
      </g>

      <g transform="translate(38 530)">
        <rect width="444" height="106" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="29" width="48" height="48" href="https://avatars.githubusercontent.com/u/7701252?v=4"/>
        <text x="110" y="44" fill="#eef8ff" font-size="23" font-weight="850">YARA</text>
        <text x="110" y="74" fill="#8fa8ba" font-size="17">Malware rule matching</text>
      </g>

      <g transform="translate(38 660)">
        <rect width="444" height="106" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="66" height="66" rx="18" fill="#f8fbff"/>
        <image x="29" y="29" width="48" height="48" href="https://avatars.githubusercontent.com/u/36671444?v=4"/>
        <text x="110" y="44" fill="#eef8ff" font-size="23" font-weight="850">Velociraptor</text>
        <text x="110" y="74" fill="#8fa8ba" font-size="17">Read-only DFIR collection</text>
      </g>
    </g>

    <g transform="translate(1865 315)" filter="url(#shadow)">
      <rect width="445" height="900" rx="34" fill="url(#panel)" stroke="#43d9ff" stroke-opacity="0.18"/>
      <text x="34" y="58" fill="#eef8ff" font-size="31" font-weight="900">4. Response</text>
      <text x="34" y="98" fill="#8fa8ba" font-size="19">Human-reviewed and audit-safe outcomes</text>

      <g transform="translate(34 140)">
        <rect width="377" height="116" rx="24" fill="url(#card)" stroke="#43d9ff" stroke-opacity="0.24"/>
        <rect x="20" y="20" width="74" height="74" rx="20" fill="#f8fbff"/>
        <image x="31" y="31" width="52" height="52" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/thehive.svg"/>
        <text x="116" y="48" fill="#eef8ff" font-size="24" font-weight="900">Cases</text>
        <text x="116" y="80" fill="#8fa8ba" font-size="17">Evidence, tasks, reports</text>
      </g>

      <g transform="translate(34 286)">
        <rect width="377" height="116" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="74" height="74" rx="20" fill="#f8fbff"/>
        <image x="31" y="31" width="52" height="52" href="https://www.google.com/s2/favicons?domain=shuffler.io&amp;sz=128"/>
        <text x="116" y="48" fill="#eef8ff" font-size="24" font-weight="900">Approval Gateway</text>
        <text x="116" y="80" fill="#8fa8ba" font-size="17">Human-in-the-loop IR</text>
      </g>

      <g transform="translate(34 432)">
        <rect width="377" height="116" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.11"/>
        <rect x="20" y="20" width="74" height="74" rx="20" fill="#f8fbff"/>
        <image x="31" y="31" width="52" height="52" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/docker.svg"/>
        <text x="116" y="48" fill="#eef8ff" font-size="24" font-weight="900">SOC Services</text>
        <text x="116" y="80" fill="#8fa8ba" font-size="17">Audit-only execution</text>
      </g>

      <g transform="translate(34 602)">
        <rect width="377" height="156" rx="26" fill="#061017" fill-opacity="0.62" stroke="#27f5b1" stroke-opacity="0.26"/>
        <text x="28" y="44" fill="#27f5b1" font-size="22" font-weight="900">Safety defaults</text>
        <text x="28" y="78" fill="#a9becf" font-size="17">Audit-only response mode</text>
        <text x="28" y="108" fill="#a9becf" font-size="17">No destructive DFIR actions</text>
        <text x="28" y="138" fill="#a9becf" font-size="17">Release checklist before public</text>
      </g>
    </g>

    <path d="M610 765 H665" stroke="url(#accent)" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>
    <path d="M1205 765 H1260" stroke="url(#accent)" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>
    <path d="M1800 765 H1855" stroke="url(#accent)" stroke-width="7" marker-end="url(#arrow)" filter="url(#glow)"/>

    <path d="M935 1215 C935 1310 1550 1310 1550 1215" fill="none" stroke="#7d5cff" stroke-opacity="0.55" stroke-width="5" stroke-dasharray="14 12" marker-end="url(#arrow)"/>
    <text x="1030" y="1350" fill="#b8a9ff" font-size="20" font-weight="800">Feedback loop: enrichment results, analyst decisions, and regression checks improve future detections</text>

    <g transform="translate(110 1310)">
      <rect width="2180" height="100" rx="28" fill="#061017" fill-opacity="0.62" stroke="#ffffff" stroke-opacity="0.10"/>
      <image x="32" y="24" width="52" height="52" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/docker.svg"/>
      <text x="104" y="42" fill="#eef8ff" font-size="23" font-weight="900">Validation &amp; delivery plane</text>
      <text x="104" y="73" fill="#9fb4c5" font-size="18">Docker Compose config, Wazuh XML parse checks, Python service compile, GitHub Actions CI, Dependabot, and public release checklist.</text>
      <rect x="1840" y="24" width="52" height="52" rx="14" fill="#f8fbff"/>
      <image x="1850" y="34" width="32" height="32" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/github-light.svg"/>
      <text x="1910" y="58" fill="#eef8ff" font-size="21" font-weight="850">CI green before release</text>
    </g>

    <text x="110" y="1460" fill="#71889b" font-size="16">Logos/icons are loaded from public project domains, Dashboard Icons, Simple Icons, and official GitHub organization avatars. Project-specific controls remain sanitized for portfolio publishing.</text>
  </g>
</svg>
