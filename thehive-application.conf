## Free/community TheHive 3.x configuration
play.http.secret.key=${?THEHIVE_PLAY_SECRET}
play.http.port=9000
play.http.address="0.0.0.0"

## Database
db {
  name = thehive
  hosts = ["cassandra"]
  port = 9042
  keyspace = thehive_community
}

## Search engine
search {
  index = the_hive_community
  uri = "http://thehive-es:9200"
}

## Cortex
cortex {
  servers = [
    {
      name = "cortex"
      url = "http://cortex:9001"
    }
  ]
}

## Authentication
auth {
  provider = [local, oauth2]
}

auth.sso.autocreate = true
auth.sso.autoupdate = true
auth.sso.attributes.login = "email"
auth.sso.attributes.name = "name"
auth.sso.defaultRoles = ["admin", "read", "write", "alert"]

auth.oauth2.clientId = "thehive"
auth.oauth2.clientSecret = ${?THEHIVE_OAUTH_CLIENT_SECRET}
auth.oauth2.redirectUri = "https://thehive/api/ssoLogin"
auth.oauth2.responseType = "code"
auth.oauth2.grantType = "authorization_code"
auth.oauth2.authorizationUrl = "http://10.10.50.70/realms/master/protocol/openid-connect/auth"
auth.oauth2.tokenUrl = "http://10.10.50.70/realms/master/protocol/openid-connect/token"
auth.oauth2.userUrl = "http://10.10.50.70/realms/master/protocol/openid-connect/userinfo"
auth.oauth2.scope = ["openid", "profile", "email"]
auth.oauth2.authorizationHeader = "Bearer"
