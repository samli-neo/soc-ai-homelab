<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>yes</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://demo.indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/var/ossec/data/indexer-certs/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/var/ossec/data/indexer-certs/admin.pem</certificate>
      <key>/var/ossec/data/indexer-certs/admin-key.pem</key>
    </ssl>
  </indexer>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <!-- Optional upstream rules disabled in this lab because their CDB lists are not compiled in the container image. -->
    <rule_exclude>0350-amazon_rules.xml</rule_exclude>
    <rule_exclude>0365-auditd_rules.xml</rule_exclude>
    <rule_exclude>0998-aws-security-hub-rules.xml</rule_exclude>
    <rule_exclude>0999-malicious-ioc-rules.xml</rule_exclude>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
    <list>etc/lists/misp_ip_iocs</list>
    <list>etc/lists/misp_domain_iocs</list>
    <list>etc/lists/misp_hash_iocs</list>
  </ruleset>

  <!-- ==================================================
       INTEGRATIONS
       ================================================== -->

  <!-- Forward selected level 7+ alerts to Shuffle SOAR workflow execution API. -->
  <integration>
    <name>custom-shuffle</name>
    <hook_url>http://soc-intake-router:8080/intake</hook_url>
    <api_key>SHUFFLE_API_KEY_FROM_ENV_OR_DEPLOY</api_key>
    <level>7</level>
    <alert_format>json</alert_format>
    <options>
      <event_type>alert</event_type>
    </options>
  </integration>

  <!-- ==================================================
       REMOTE SYSLOG (pfsense, autres sources)
       ================================================== -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
    <local_ip>0.0.0.0</local_ip>
  </remote>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
    <local_ip>0.0.0.0</local_ip>
  </remote>

  <!-- ==================================================
       ACTIVE RESPONSE
       ================================================== -->


  <!-- ==================================================
       COMMANDS
       ================================================== -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop.sh</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny.sh</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- ==================================================
       ACTIVE RESPONSE RULES
       ================================================== -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <level>10</level>
    <rules_group>authentication_failed,authentication_failures</rules_group>
    <timeout>600</timeout>
  </active-response>

  <!-- ==================================================
       SYSCHECK
       ================================================== -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>72000</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" report_changes="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes">/bin,/sbin</directories>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>

    <nodiff>/etc/ssl/private.key</nodiff>
  </syscheck>

  <!-- ==================================================
       ROOTCHECK
       ================================================== -->
  <rootcheck>
    <disabled>no</disabled>
    <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
  </rootcheck>

  <!-- ==================================================
       SCAP
       ================================================== -->
  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="vulnerability-detector">
    <disabled>no</disabled>
    <interval>12:00</interval>
    <run_on_start>no</run_on_start>
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>trusty</os>
      <os>xenial</os>
      <os>bionic</os>
      <os>focal</os>
      <os>jammy</os>
    </provider>
    <provider name="redhat">
      <enabled>yes</enabled>
      <os>7</os>
      <os>8</os>
      <os>9</os>
    </provider>
    <provider name="debian">
      <enabled>yes</enabled>
      <os>10</os>
      <os>11</os>
      <os>12</os>
    </provider>
  </wodle>

  <!-- ==================================================
       LOG COLLECTION
       ================================================== -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/*</location>
  </localfile>

  <localfile>
    <log_format>command</log_format>
    <command>df -h</command>
    <frequency>36000</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | grep -E 'LISTEN|ESTABLISHED'</command>
    <frequency>36000</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>36000</frequency>
  </localfile>

  <!-- Wazuh internal logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- ==================================================
       AGENT CONFIGURATION
       ================================================== -->
</ossec_config>
