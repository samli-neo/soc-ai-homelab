name: Feature request
description: Propose a professionalization or SOC capability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be better after this change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection engineering
        - SOAR workflow
        - Malware analysis
        - DFIR
        - Documentation
        - Portfolio design
        - CI/security
        - Deployment
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the checks that prove the work is done.
