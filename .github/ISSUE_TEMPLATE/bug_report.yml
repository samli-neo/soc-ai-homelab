name: Bug report
description: Report a validation, documentation, or automation defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failed or behaved unexpectedly?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include commands, inputs, and expected vs actual behavior.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste sanitized logs or screenshots only. Do not include secrets.
