server {
    listen 80;
    server_name _;

    location /api/v1/login_openid {
        # Rewrite the redirect_uri from relative to absolute
        if ($args ~* "redirect_uri=%2Fapi%2Fv1%2Flogin_openid") {
            rewrite ^ /api/v1/login_openid?redirect_uri=http://10.10.50.10/api/v1/login_openid last;
        }
        proxy_pass http://10.10.50.10:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://10.10.50.10:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}