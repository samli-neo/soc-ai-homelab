search {
  index = cortex
  uri = "http://thehive-es:9200"
}

cache.job = 10 minutes

auth {
  provider = [local, oidc]
  sso {
    autocreate = true
    autoupdate = true
    mapper = "simple"
    attributes {
      login = "email"
      name = "name"
    }
    oidc {
      clientId = "cortex"
      clientSecret = ${?CORTEX_OIDC_CLIENT_SECRET}
      url = "http://10.10.50.70/realms/master"
      redirectUrl = "http://10.10.50.24/api/ssoLogin"
      scope = ["openid", "profile", "email"]
    }
  }
}
