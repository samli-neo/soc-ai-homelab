server {
    listen       80;
    server_name  _;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        gzip off;
        sub_filter '/api/v1/login_openid' 'https://shuffle/api/v1/login_openid';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/json;
    }

    location = /api/v1/checkusers {
        default_type application/json;
        return 200 '{"success": true, "reason": "redirect", "sso_url": "http://10.10.50.70/realms/master/protocol/openid-connect/auth?client_id=shuffle&response_type=id_token&scope=openid%20email&redirect_uri=https%3A%2F%2Fshuffle%2Fapi%2Fv1%2Flogin_openid&state=b3JnPTA5ZjBlNDY4LTFmZWQtNGQyNS05NTJkLWE1MzM2ZmMwM2IyNSZyZWRpcmVjdD0lMkZhcGklMkZ2MSUyRmxvZ2luX29wZW5pZCZjaGFsbGVuZ2U9c2h1ZmZsZS1zc28tc2VjcmV0LTIwMjY=&response_mode=form_post&nonce=b3JnPTA5ZjBlNDY4LTFmZWQtNGQyNS05NTJkLWE1MzM2ZmMwM2IyNSZyZWRpcmVjdD0lMkZhcGklMkZ2MSUyRmxvZ2luX29wZW5pZCZjaGFsbGVuZ2U9c2h1ZmZsZS1zc28tc2VjcmV0LTIwMjY="}';
    }

    location /api/ {
        proxy_pass http://shuffle-backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept-Encoding "";
        proxy_redirect http://localhost:3001/ https://shuffle/;
        proxy_redirect http://localhost:3001 https://shuffle;
        sub_filter 'redirect_uri=%2Fapi%2Fv1%2Flogin_openid' 'redirect_uri=https%3A%2F%2Fshuffle%2Fapi%2Fv1%2Flogin_openid';
        sub_filter 'redirect_uri=/api/v1/login_openid' 'redirect_uri=https://shuffle/api/v1/login_openid';
        sub_filter_once off;
        sub_filter_types application/json;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
